[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yamin"
version = "0.2.4"
description = "A terminal AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yamin Hossain" }]
dependencies = [
    "openai",
    "rich",
    "prompt_toolkit",
]

[project.scripts]
yamin = "yamin.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["yamin*"]